services:
  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wolves}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wolves}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SERVER_STATUS_MODE: ${SERVER_STATUS_MODE:-live}
      VALHEIM_STATUS_URL: ${VALHEIM_STATUS_URL:-https://valheim-map.webble.se/api/status}
      VALHEIM_PLAYERS_URL: ${VALHEIM_PLAYERS_URL:-https://valheim-map.webble.se/api/players}
      VALHEIM_PLAYERS_TOKEN: ${VALHEIM_PLAYERS_TOKEN:-}
      VALHEIM_MAP_URL: ${VALHEIM_MAP_URL:-https://valheim-map.webble.se}
      VALHEIM_JOIN_ADDRESS: ${VALHEIM_JOIN_ADDRESS:-valheim-map.webble.se}
      VALHEIM_JOIN_PORT: ${VALHEIM_JOIN_PORT:-2456}
      SERVER_STATUS_CACHE_SECONDS: ${SERVER_STATUS_CACHE_SECONDS:-30}
      SERVER_STATUS_TIMEOUT_MS: ${SERVER_STATUS_TIMEOUT_MS:-3000}
      SERVER_STATUS_ALLOW_PRIVATE_HOSTS: ${SERVER_STATUS_ALLOW_PRIVATE_HOSTS:-false}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-x-forwarded-proto}
      HOST_HEADER: ${HOST_HEADER:-x-forwarded-host}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    expose:
      - '3000'
    networks:
      - app-network
      - dokploy-network
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    build:
      context: .
      target: migration
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wolves}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wolves}
    networks:
      - app-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wolves}
      POSTGRES_USER: ${POSTGRES_USER:-wolves}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wolves} -d ${POSTGRES_DB:-wolves}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  uploads:

networks:
  app-network:
    driver: bridge
    internal: true
  dokploy-network:
    external: true
